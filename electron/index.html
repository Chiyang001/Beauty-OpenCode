<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>Beauty OpenCode</title><link rel="stylesheet" href="ui.css"></head>
<body><header><div class="brand"><img class="brand-mark" src="../assets/icon.png" alt=""><span>Beauty OpenCode</span></div><div class="developer-area"><nav class="developer-links" aria-label="开发者主页"><a href="https://github.com/Chiyang001?tab=repositories" data-external-link title="访问炽阳001的 GitHub"><i data-lucide="github"></i><span>GitHub</span></a><a href="https://space.bilibili.com/404891612" data-external-link title="访问炽阳001的B站主页"><i data-lucide="tv-minimal-play"></i><span>B站</span></a></nav><div class="developer-profile"><img src="../assets/developer.png" alt="炽阳001的头像"><div><span class="developer-label">开发者</span><span class="developer-name">炽阳001</span></div></div></div></header>
<main><div class="intro"><div><p class="eyebrow">你的工作空间，你的选择</p><h1>选择 OpenCode 的模样</h1></div><span id="current" class="current">正在检查安装</span></div>
<div class="workspace"><section class="choices" aria-label="界面模式"><button class="mode" data-mode="classic" aria-pressed="false"><div class="mode-top"><i data-lucide="panels-top-left"></i><span class="radio"></span></div><h2>经典模式</h2><p>熟悉的原生界面<br>保留 OpenCode 的经典体验</p><span class="mode-foot">ORIGINAL <i data-lucide="arrow-up-right"></i></span></button><button class="mode selected" data-mode="modern" aria-pressed="true"><div class="mode-top"><i data-lucide="panel-left"></i><span class="radio"></span></div><h2>全新改版</h2><p>更清晰的项目与对话<br>专注于每一次创作</p><span class="mode-foot">BEAUTY V2 <i data-lucide="sparkles"></i></span></button></section>
<section class="preview"><div class="preview-head"><span><span class="live-dot"></span> 界面预览</span><span id="preview-label">全新改版</span></div><div class="preview-image"><img id="preview" src="../screenshots/opencode-compact-chat.jpg" alt="全新改版 OpenCode 界面预览"></div><div class="preview-bottom"><div><h3 id="preview-title">为专注而重新整理</h3><p id="preview-copy">项目与聊天始终在侧，工作区更从容。</p></div><span class="preview-index" id="preview-index">02 / 02</span></div></section></div>
<section class="installation"><div class="install-icon"><i data-lucide="folder-open"></i></div><div class="install-details"><label for="folder">OpenCode 安装位置</label><input id="folder" spellcheck="false" aria-label="OpenCode 安装位置"></div><button id="choose" class="icon-button" title="选择安装目录" aria-label="选择安装目录"><i data-lucide="folder-search"></i></button></section>
<footer><div class="status"><span id="status-dot"></span><div><p id="status" role="status">正在检查安装</p><small id="version"></small></div></div><button id="launch" class="secondary"><i data-lucide="external-link"></i>打开 OpenCode</button><button id="apply" class="primary"><span>应用全新改版</span><i data-lucide="arrow-right"></i></button></footer></main>
<script src="../node_modules/lucide/dist/umd/lucide.js"></script><script src="ui.js"></script></body></html>
